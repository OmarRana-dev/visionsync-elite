<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisionSync Elite - Global Lobby</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #09090b;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image:
        radial-gradient(circle at 15% 50%, rgba(229, 46, 113, 0.08), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(255, 138, 0, 0.08), transparent 25%);
    }

    header {
      width: 100%;
      padding: 40px 20px;
      text-align: center;
      box-sizing: border-box;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 42px;
      font-weight: 900;
      margin: 0;
      background: linear-gradient(90deg, #ff8a00, #e52e71);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }

    p.subtitle {
      color: #888;
      font-size: 16px;
      margin-top: 10px;
      font-weight: 400;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      padding: 40px 20px;
      box-sizing: border-box;
      flex: 1;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .name-input {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px 20px;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      outline: none;
      width: 300px;
      transition: all 0.3s ease;
    }

    .name-input:focus {
      border-color: #ff8a00;
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 15px rgba(255, 138, 0, 0.2);
    }

    .refresh-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 14px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .rooms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 24px;
    }

    .room-card {
      background: rgba(20, 20, 25, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      display: flex;
      flex-direction: column;
    }

    .room-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #ff8a00, #e52e71);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .room-card:hover {
      transform: translateY(-5px);
      border-color: rgba(229, 46, 113, 0.3);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 0 20px rgba(229, 46, 113, 0.1);
    }

    .room-card:hover::before {
      opacity: 1;
    }

    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .host-name {
      font-size: 22px;
      font-weight: 800;
      margin: 0;
      color: #fff;
    }

    .host-badge {
      font-size: 10px;
      color: #ff8a00;
      border: 1px solid #ff8a00;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 4px;
      display: inline-block;
    }

    .users-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(37, 211, 102, 0.15);
      color: #25d366;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }

    .users-badge.vip {
      background: rgba(162, 110, 212, 0.15);
      color: #d1b3ff;
      box-shadow: 0 0 10px rgba(162, 110, 212, 0.2);
    }

    .users-badge .dot {
      width: 8px;
      height: 8px;
      background: #25d366;
      border-radius: 50%;
      box-shadow: 0 0 8px #25d366;
    }

    .movie-url {
      font-family: monospace;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 24px;
      word-break: break-all;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .join-btn {
      background: linear-gradient(90deg, #ff8a00, #e52e71);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      width: 100%;
      margin-top: auto;
    }

    .join-btn:hover {
      box-shadow: 0 5px 20px rgba(229, 46, 113, 0.4);
      filter: brightness(1.1);
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #666;
    }

    .empty-state h2 {
      font-size: 24px;
      color: #888;
    }
  </style>
</head>

<body>

  <header>
    <h1>VisionSync Elite</h1>
    <p class="subtitle">Global Lobby • Discover & Join Active Watch Parties</p>
  </header>

  <div class="container">
    <div class="controls">
      <input type="text" id="usernameInput" class="name-input" placeholder="Enter your display name...">
      <button id="refreshBtn" class="refresh-btn">Refresh Rooms</button>
    </div>

    <div id="roomsGrid" class="rooms-grid">
      <!-- Cards injected here -->
    </div>
  </div>

  <script src="lobby.js"></script>
</body>

</html>
